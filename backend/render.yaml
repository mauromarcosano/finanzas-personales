services:
  - type: web
    name: bot-gastos-backend
    env: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bot-gastos-db
          property: connectionString

databases:
  - name: bot-gastos-db
    region: ohio
    plan: free
